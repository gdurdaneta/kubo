# Compila kubo para Linux, macOS y Windows y publica los binarios en una
# release. Se dispara al empujar un tag `v*` (o a mano desde Actions).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # glibc es compatible hacia adelante, no hacia atrás: se compila en un
      # contenedor viejo para no dejar afuera a Ubuntu 22.04.
      - name: Compilar en contenedor
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e CARGO_TERM_COLOR=always ubuntu:22.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                curl ca-certificates build-essential pkg-config
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              cargo build --release --locked
            '
      # Docker sí sirve para esto: comprobar que el binario arranca en las
      # distros viejas a las que apunta el contenedor de build. (Para Windows
      # y macOS no hay contenedor posible: uno necesita kernel de Windows y el
      # otro solo puede virtualizarse en hardware de Apple.)
      - name: Probar en distros viejas
        run: |
          for img in ubuntu:22.04 debian:12 fedora:40; do
            echo "--- $img"
            docker run --rm -v "$PWD/target/release/kubo":/kubo:ro "$img" /kubo --version
          done
      - name: Empaquetar
        run: |
          mkdir -p dist && cp target/release/kubo dist/
          tar czf dist/kubo-linux-x86_64.tar.gz -C dist kubo
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Compilar ambas arquitecturas
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Armar .app y .dmg
        run: ./packaging/macos.sh "${GITHUB_REF_NAME#v}"
      # El runner es macOS de verdad: se ejecuta el binario del bundle para
      # confirmar que arranca, que la firma vale y que trae las dos arquitecturas.
      - name: Probar el bundle
        run: |
          ./dist/kubo.app/Contents/MacOS/kubo --version
          codesign --verify --deep --strict --verbose=2 dist/kubo.app
          lipo -archs dist/kubo.app/Contents/MacOS/kubo
          # Que el .dmg monte y la app esté adentro.
          hdiutil attach dist/kubo-macos-universal.dmg -mountpoint /tmp/kubo-dmg -nobrowse
          ls -la /tmp/kubo-dmg
          /tmp/kubo-dmg/kubo.app/Contents/MacOS/kubo --version
          hdiutil detach /tmp/kubo-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release --locked
      # El runner es Windows de verdad: si al .exe le faltara una DLL o un
      # símbolo, esto falla acá y no en la máquina de quien lo descargue.
      - name: Probar el .exe
        run: |
          .\\target\\release\\kubo.exe --version
          .\\target\\release\\kubo.exe --help
      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p dist && cp target/release/kubo.exe dist/
          cd dist && 7z a kubo-windows-x86_64.zip kubo.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/kubo.exe
            dist/kubo-windows-x86_64.zip

  publicar:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artefactos }
      - name: Crear release
        # Bloque literal: un escalar plano de YAML pliega los saltos de línea y
        # la barra de continuación quedaba como argumento suelto.
        run: |
          gh release create "$GITHUB_REF_NAME" artefactos/*/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
